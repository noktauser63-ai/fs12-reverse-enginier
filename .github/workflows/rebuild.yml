name: Rebuild (arm64 + evrensel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "tools/**", "CMakeLists.txt", ".github/workflows/rebuild.yml"]

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Araclar
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ninja-build python3-numpy
      - name: Ses dosyalarini APK'dan cikar
        run: |
          ASSETZIP="$(find . -path ./build-host -prune -o \( -name main.zip -o -name 'main*.apk' -o -name 'main*.obb' -o -name 'FS12*.apk' \) -print | head -1)"
          if [ -z "$ASSETZIP" ]; then echo "HATA: oyunun asset zip'i yok. Repoya mainapk/main.zip (orijinal APK'nin assets/ klasorunu iceren zip) koy."; exit 1; fi
          echo "asset kaynagi: $ASSETZIP"
          unzip -q -o "$ASSETZIP" 'assets/audio/*' -d "$RUNNER_TEMP/apk"
      - name: Derle
        run: |
          cmake -S . -B build-host -G Ninja -DFS12_BUILD_TESTS=ON
          cmake --build build-host
      - name: Ses motoru testi
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ./build-host/audio_test "$RUNNER_TEMP/apk/assets/audio" "$RUNNER_TEMP/out"
          python3 tools/verify_audio.py "$RUNNER_TEMP/apk/assets/audio" "$RUNNER_TEMP/out"
      - name: Matematik testi
        run: ./build-host/math_test
      - name: Fizik (Box2D 2.1.2) testi
        run: ./build-host/physics_test
      - name: Platform testi
        run: ./build-host/platform_test
      - name: GUI yerlesim + cizim izi testi
        run: |
          ./build-host/layout_test tests/golden/gui_layout.txt
          ./build-host/gui_trace_test tests/golden
          ./build-host/gui_input_test tests/golden/gui_input.txt
          ./build-host/menu_flow_test
          ./build-host/savegames_test

  android:
    needs: host-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: NDK'yi bul (runner'da hazir; setup-android eylemi KULLANILMIYOR)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "Hazir NDK yok, sdkmanager ile kuruluyor"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Kullanilan NDK: $NDK"
      - name: Derle (${{ matrix.abi }}) - once multiplayer modlu, olmazsa modsuz
        run: |
          B=build-${{ matrix.abi }}
          cfg() { cmake -S . -B "$B" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DFS12_WITH_MOD=$1; }
          if cfg ON && cmake --build "$B" 2> "$RUNNER_TEMP/mod-build.log"; then
            echo "Multiplayer modu DAHIL derlendi"
          else
            echo "::warning::Mod derlenemedi (log: android-mod-log artifact); modsuz derleniyor"
            cat "$RUNNER_TEMP/mod-build.log" | tail -60
            rm -rf "$B"; cfg OFF; cmake --build "$B"
          fi
      - name: 16 KB sayfa hizasi kontrolu
        run: |
          f=build-${{ matrix.abi }}/libapp.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$f" | grep LOAD
      - uses: actions/upload-artifact@v4
        with:
          name: libapp-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/libapp.so

  android-mod:
    # Cok oyunculu mod (ImGui + ag) derleme denemesi; paketlemeyi engellemez (continue-on-error).
    needs: host-tests
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
      - name: Derle (mod acik, ${{ matrix.abi }})
        run: |
          cmake -S . -B build-mod -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DFS12_WITH_MOD=ON
          cmake --build build-mod 2>&1 | tail -80

  package:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libapp-*
          path: libs
      - name: Ses varliklarini cikar
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          ASSETZIP="$(find . -path ./build-host -prune -o \( -name main.zip -o -name 'main*.apk' -o -name 'main*.obb' -o -name 'FS12*.apk' \) -print | head -1)"
          if [ -z "$ASSETZIP" ]; then echo "HATA: oyunun asset zip'i yok. Repoya mainapk/main.zip (orijinal APK'nin assets/ klasorunu iceren zip) koy."; exit 1; fi
          echo "asset kaynagi: $ASSETZIP"
          unzip -q -o "$ASSETZIP" 'assets/*' -d "$RUNNER_TEMP/apk"   # audio, gui, map, objects, shader (dunya gorunumu icin map/ gerekli)
          for d in audio gui map objects shader; do [ -d "$RUNNER_TEMP/apk/assets/$d" ] || echo "UYARI: assets/$d yok"; done
          ls "$RUNNER_TEMP/apk/assets" | head
      - name: Ek araclari uygula (ext_assets/ -> assets/)
        run: |
          if [ -d ext_assets ]; then cp -r ext_assets/objects/. "$RUNNER_TEMP/apk/assets/objects/"; cp -r ext_assets/gui/. "$RUNNER_TEMP/apk/assets/gui/"; mkdir -p "$RUNNER_TEMP/apk/assets/audio"; cp -r ext_assets/audio/. "$RUNNER_TEMP/apk/assets/audio/"; cp -r ext_assets/ext_mahsul_dokulari ext_assets/ext_karakter_dokulari "$RUNNER_TEMP/apk/assets/"; fi
      - name: Yuksek kaliteli dokulari uygula (hd_textures/ -> .p2d)
        run: |
          pip install pillow
          if [ -d hd_textures ]; then python3 tools/png2p2d.py "$RUNNER_TEMP/apk/assets" hd_textures "$RUNNER_TEMP/apk/assets" | tail -40; fi
      - name: Turkce harfler icin font atlasini yamala
        run: |
          pip install numpy pillow
          F="$RUNNER_TEMP/apk/assets/gui/font03_P.p2d"
          python3 tools/patch_font_tr.py "$F" "$F" "$RUNNER_TEMP/FontTr.cpp"
          diff "$RUNNER_TEMP/FontTr.cpp" src/data/FontTr.cpp   # kaynaktaki glif tablosu ile ayni olmali
      - name: APK uret (arm64 + evrensel)
        run: |
          mkdir -p out
          bash tools/make_apk.sh out/FS12-smoke-arm64.apk "$RUNNER_TEMP/apk/assets" arm64-v8a:libs/libapp-arm64-v8a/libapp.so
          bash tools/make_apk.sh out/FS12-smoke-universal.apk "$RUNNER_TEMP/apk/assets" \
            arm64-v8a:libs/libapp-arm64-v8a/libapp.so \
            armeabi-v7a:libs/libapp-armeabi-v7a/libapp.so \
            x86_64:libs/libapp-x86_64/libapp.so
      - uses: actions/upload-artifact@v4
        with:
          name: FS12-apk
          path: out/*.apk
